events_api:
  name: BookIt for Forms - Events API
  kind: browser-custom-events
  description: >-
    LeanData fires custom events on the host page during the BookIt calendaring experience so a
    customer's own code can react — the documented example is an event fired as soon as the
    routing-graph API request resolves, carrying the graph's decision (show a calendar, redirect,
    or fall back).
  docs: https://leandatahelp.zendesk.com/hc/en-us/articles/24466862228123-BookIt-for-Forms-Events-API
  docs_public: false
  docs_http_status: 403
  fetched: '2026-08-13'
  note: >-
    These are browser-side DOM events, NOT server-to-server webhooks. No event names or payload
    schemas are recorded here because the reference article is behind the authenticated help
    center and nothing verifiable was available. Deliberately not emitted as a Webhooks or
    AsyncAPI surface — see conformance/leandata-conformance.yml.
gaps:
  - No versioned, pinnable loader script for the embedded scheduler.
  - No npm or CDN distribution for any client-side component.
