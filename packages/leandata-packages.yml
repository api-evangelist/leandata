method: searched
source: registry searches across npm, PyPI, RubyGems, plus the LeanData GitHub organization and docs
description: >-
  LeanData publishes no first-party client library in any public package registry. Searches of
  npm, PyPI and RubyGems return zero LeanData-authored packages, and the LeanData GitHub
  organization holds two repositories, neither of which is an SDK. The published integration
  path is a Postman collection plus raw HTTP with an X-Api-Key header — which is workable, but
  it means there is no versioned, dated artifact anywhere that tracks the API, and therefore no
  decay signal a consumer can read.
