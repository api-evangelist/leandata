- aid: leandata:leandata-one-time-routing-api
  name: LeanData One Time Routing API
  description: >-
    <p>This section describes the endpoints used to trigger 1x Routing for creating a custom orchestration
    experience, as well as to retrieve the status of the resulting job. When invoked, the 1x Routing endpoint
    returns basic job metadata—including the <code>jobId</code>—which can be used to check the job’s status.</p>

    <ul>

    <li><p><code>orchestration/v1/one-time-routing</code> — Use this endpoint to invoke 1x routing for
    a particular SFDC org</p>

    </li>

    <li><p><code>orchestration/v1/one-time-routing/:jobId</code> — Use this endpoint to retrieve the job
    status of a 1x routing for a particular SFDC org</p>

    </li>

    </ul>

    <p>❗️ <strong>Important:</strong> The API does <strong>not</strong> validate FlowBuilder graphs before
    triggering routing. If you invoke 1x Routing to an invalid or misconfigured graph, the request will
    still be processed—but routing will fail silently. No error response will be returned from the API.<br
    />✅ To avoid unexpected behavior, please ensure the graph is valid and functioning as expected within
    the LeanData application before using it in API-triggered routing.</p>
  humanURL: https://docs.leandata.com
  tags:
  - One Time Routing
  properties:
  - type: OpenAPI
    url: openapi/leandata-one-time-routing-api-openapi.yml
  - type: Documentation
    url: https://docs.leandata.com
