- aid: leandata:leandata-legacy-still-supported-api
  name: LeanData Legacy (still supported) API
  description: >-
    <p>This section outlines the endpoints used to retrieve scheduling data for building a custom calendaring
    experience. Both endpoints return the same structure of <strong>read-only</strong> information—including
    scheduling metadata, working hours, available time slots, and configured users—that can be used to
    render the scheduling page.</p>

    <ul>

    <li><p><strong><code>v1/scheduling/retrieve-info</code></strong> — Use this endpoint <strong>when
    booking a meeting</strong> <strong>for the first time</strong>.</p>

    </li>

    <li><p><strong><code>v1/scheduling/retrieve-modification-info</code></strong> — Use this endpoint
    <strong>when modifying an existing meeting</strong>, such as rescheduling or canceling.</p>

    </li>

    </ul>

    <p>These endpoints provide all the data needed to power the UI for selecting a meeting time and pre-populating
    prospect details.</p>
  humanURL: https://docs.leandata.com
  baseURL: https://api.leandata.com
