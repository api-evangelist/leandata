  name: LeanData 🗓️ Availability API
  description: >-
    <p>The availability endpoints return meeting configuration and open time slots used to render booking
    pages or refresh availability. Depending on the request context (routing, direct link, or reschedule),
    the response includes meeting details, eligible hosts, and available time windows.</p>

    <ul>

    <li><p><strong>POST</strong> <code>/v1/scheduling/route-and-fetch-availability</code></p>

    </li>

    <li><p><strong>POST</strong> <code>/v1/scheduling/fetch-availability</code></p>

    </li>

    </ul>
  humanURL: https://docs.leandata.com
