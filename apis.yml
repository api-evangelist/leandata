- aid: leandata:leandata-meetings-create-api
  name: LeanData 📆 Meetings > Create API
  description: >-
    <p>Use these endpoints to finalize and book meetings after a timeslot has been selected.</p>

    <p>⚠️ <strong>Important:</strong> You <strong>must</strong> support both <code>POST /v1/meeting</code>
    and <code>POST /v1/round-robin-meeting</code>.</p>

    <p>The correct endpoint is determined by the availability response:</p>

    <ul>

    <li><p>If <code>pageInfo.displayAllPoolAvailability = true</code>, you must book using <code>POST
    /v1/round-robin-meeting</code>.</p>

    </li>

    <li><p>If <code>pageInfo.displayAllPoolAvailability = null</code> or <code>false</code>, you must
    book using <code>POST /v1/meeting</code>.</p>

    </li>

    </ul>

    <p>This behavior is driven by your scheduling graph configuration and cannot be assumed ahead of time.</p>
  humanURL: https://docs.leandata.com
  tags:
  - 📆 Meetings > Create
  properties:
