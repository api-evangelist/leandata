    url: https://www.leandata.com/blog/leandata-q2-2026-release-audit-logs-best-fit-assignment-bookit-mcp/
    version: Q2 2026
    breaking:
      - >-
        Track SLA node replaces the Hold Until node in FlowBuilder graphs. Documented as a
        replacement rather than an addition, so existing graphs using Hold Until are affected.
    additions:
      - >-
        BookIt MCP — a hosted MCP server exposing BookIt scheduling and operational data to
        MCP-compatible AI clients (Claude, ChatGPT, Agentforce, Cursor), authorized with
        Salesforce OAuth or a one-time code for external partners and agents.
      - >-
        Unified audit logs — a single searchable view across all objects and products, 24 months
        of retention, syncing on a 15-minute schedule.
      - LeanData AI Assistant embedded in Audit Logs to explain routing decisions in plain language.
      - >-
        Best-Fit Assignment — a Round Robin enhancement that assigns on rep attributes such as
        language, expertise, tenure and certifications.
      - Track SLA node supporting multiple simultaneous SLAs with built-in notifications.
      - Multi-hierarchy support — up to 10 distinct account hierarchies per org from multiple enrichment sources.
    api_impact: >-
      BookIt MCP is a new agent-facing surface at https://mcp.leandata.com/mcp. No changes to the
      BookIt, Graph or Matching REST contracts were announced.
